  <style>
    .animation {
      animation: animation 10s infinite linear;
    }

    @keyframes animation {

      0%,
      2%,
      4%,
      60%,
      62%,
      64% {
        opacity: 1;
      }

      1%,
      61% {
        opacity: 0;
      }

      0%,
      100%,
      4%,
      16%,
      36% {
        transform: translate(0px, 0px);
      }

      8%,
      12% {
        transform: translate(20px, 25px);
      }

      48%,
      52% {
        transform: translate(0px, -25px);
      }
    }

    @keyframes animation2 {

      0%,
      4%,
      8%,
      12%,
      100% {
        transform: translate(0px, 0px);
      }

      2% {
        transform: translate(0px, -75px);
      }

      6% {
        transform: translate(0px, -50px);
      }

      10% {
        transform: translate(0px, -25px);
      }
    }
  </style>
